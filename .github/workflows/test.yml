name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce offline source boundary
        run: bash scripts/strict-check.sh
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze and test shared UI
        run: |
          cd app
          flutter pub get --offline || flutter pub get
          flutter analyze
          flutter test
      - name: Test Rust vault and transport crates
        run: |
          cargo test --manifest-path core/vault/Cargo.toml --locked --offline || cargo test --manifest-path core/vault/Cargo.toml --locked
          cargo test --manifest-path core/transport/Cargo.toml --locked --offline || cargo test --manifest-path core/transport/Cargo.toml --locked
