name: preview-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Enforce offline source boundary
        run: bash scripts/strict-check.sh
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze and test shared UI
        run: |
          cd app
          flutter pub get --offline || flutter pub get
          flutter analyze
          flutter test
      - name: Build Linux preview bundle
        run: |
          cd app
          flutter build linux --release
          test -x build/linux/x64/release/bundle/x_messenger
      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: x-messenger-linux-preview
          path: app/build/linux/x64/release/bundle
          if-no-files-found: error
