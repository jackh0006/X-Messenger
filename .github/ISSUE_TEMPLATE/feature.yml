name: Feature request
description: Propose an idea (no secrets please!)
body:
  - type: input
    id: title
    attributes: {label: One-line idea}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: What problem does it solve?}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed change (simple words)}
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Shared UI, Rust core, QR transport, NFC transport, File transport, Docs, Packaging, Other]
    validations: {required: true}
  - type: checkboxes
    id: security
    attributes:
      options:
        - label: This adds no network code, telemetry, or secrets handling without review
        - label: I did NOT paste phrases, real messages, keys, or tokens
    validations: {required: true}
