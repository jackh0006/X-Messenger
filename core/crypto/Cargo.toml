[package]
name = "x-messenger-crypto"
version = "2.0.0"
edition = "2021"
description = "CIA-Grade Offline Messenger Core Crypto: hybrid X25519+ML-KEM-768, XChaCha20-Poly1305, Argon2id, Ed25519+Dilithium3. No network."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jackh0006/X-Messenger"

[features]
default = ["std", "alloc"]
std = ["alloc"]
alloc = []

[dependencies]
zeroize = { version = "1.8", features = ["derive"] }
thiserror = { version = "2", features = ["std"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
# Keep this exact until an explicit cryptographic dependency review approves
# an upgrade; it must agree with the audited lockfile resolution.
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
aes-gcm-siv = "0.11"
ml-kem = "0.3"
kem = { version = "0.3", features = ["getrandom"] }
ml-dsa = { version = "0.1", features = ["getrandom", "rand_core", "zeroize"] }
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
blake2 = "0.10"
argon2 = "0.5"
scrypt = "0.11"

[dev-dependencies]
hex-literal = "1"
